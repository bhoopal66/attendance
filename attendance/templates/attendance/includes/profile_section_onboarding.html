{% comment %}Section card: Onboarding Checklist — full width{% endcomment %}
<div class="section-card full-width">
    <div class="section-head">
        <span class="section-title">
            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>
            Onboarding Checklist
        </span>
        <span style="font-size:.78rem; color:var(--text-secondary);">
            {{ checklist_done }} / {{ checklist_total }} completed
        </span>
    </div>
    <div class="section-body">
        <form id="form-onboarding"
              onsubmit="event.preventDefault(); saveSection('onboarding', this);">
            {% csrf_token %}
            <div class="checklist-grid">
                {% for key, label, is_done in checklist_rows %}
                <label class="checklist-item {% if is_done %}checked{% endif %}">
                    <input type="checkbox" name="checklist_{{ key }}"
                           {% if is_done %}checked{% endif %}>
                    {{ label }}
                </label>
                {% endfor %}
            </div>
            <div class="checklist-save-wrap">
                <button type="submit" class="btn-save">Save Checklist</button>
            </div>
        </form>
    </div>
</div>
