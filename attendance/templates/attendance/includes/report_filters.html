<!-- Report Filter Dropdowns Component -->
<!-- DO NOT MODIFY: Spaces around comparison operators (==) are REQUIRED for Django templates -->
<form method="get" class="filter-bar">
    <div class="filter-group search-group">
        <label>Search</label>
        <div class="search-input-wrapper">
            <input type="text" name="search" placeholder="Search employee name..." value="{{ search_query }}"
                class="search-input">
            <button type="submit" class="search-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </button>
        </div>
    </div>
    <div class="filter-group">
        <label>Month</label>
        <select name="month" onchange="this.form.submit()">
            {% for m_num, m_name in months %}
            <option value="{{ m_num }}" {% if m_num == selected_month %}selected{% endif %}>{{ m_name }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="filter-group">
        <label>Year</label>
        <select name="year" onchange="this.form.submit()">
            {% for y in years %}
            <option value="{{ y }}" {% if y == selected_year %}selected{% endif %}>{{ y }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="filter-group checkbox-group">
        <label class="checkbox-label">
            <input type="checkbox" name="show_inactive" value="1" {% if show_inactive %}checked{% endif %}
                onchange="this.form.submit()">
            <span class="checkbox-text">Show inactive</span>
        </label>
    </div>
    <noscript><button type="submit" class="btn-primary btn-sm">Filter</button></noscript>
</form>

<style>
    /* Filter Bar Specific Styles */
    .filter-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        align-items: flex-end;
    }

    .filter-group {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
    }

    .filter-group label {
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 0;
    }

    .filter-group select {
        min-width: 140px;
        padding: 0.625rem 2.5rem 0.625rem 1rem;
        font-size: 0.9rem;
        border: 2px solid var(--border-color);
        border-radius: 10px;
        background: white;
        cursor: pointer;
        transition: all 0.2s;
    }

    .filter-group select:focus {
        border-color: var(--primary-color);
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        outline: none;
    }

    .search-group {
        flex: 1;
        min-width: 200px;
        max-width: 300px;
    }

    .search-input-wrapper {
        position: relative;
        display: flex;
    }

    .search-input {
        width: 100%;
        padding: 0.625rem 3rem 0.625rem 1rem;
        font-size: 0.9rem;
        border: 2px solid var(--border-color);
        border-radius: 10px;
        transition: all 0.2s;
    }

    .search-input:focus {
        border-color: var(--primary-color);
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        outline: none;
    }

    .search-btn {
        position: absolute;
        right: 4px;
        top: 50%;
        transform: translateY(-50%);
        width: 36px;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--primary-gradient);
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.2s;
        padding: 0;
    }

    .search-btn:hover {
        transform: translateY(-50%) scale(1.05);
    }

    .checkbox-group {
        justify-content: flex-end;
    }

    .checkbox-label {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        cursor: pointer;
        padding: 0.625rem 1rem;
        background: var(--border-light);
        border-radius: 10px;
        font-size: 0.85rem;
        color: var(--text-muted);
        transition: all 0.2s;
    }

    .checkbox-label:hover {
        background: var(--primary-light);
        color: var(--primary-color);
    }

    .checkbox-label input[type="checkbox"] {
        width: 18px;
        height: 18px;
        accent-color: var(--primary-color);
        cursor: pointer;
    }

    .checkbox-text {
        white-space: nowrap;
    }

    @media (max-width: 768px) {
        .filter-bar {
            flex-direction: column;
            align-items: stretch;
        }

        .search-group {
            max-width: none;
        }

        .filter-group select {
            width: 100%;
        }
    }
</style>
