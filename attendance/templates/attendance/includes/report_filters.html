<!-- Report Filter Dropdowns Component -->
<!-- DO NOT MODIFY: Spaces around comparison operators (==) are REQUIRED for Django templates -->
<form method="get" style="display:flex;flex-wrap:wrap;gap:0.6rem;align-items:center;width:100%">
    <div class="search-wrap">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" name="search" placeholder="Search employee name…" value="{{ search_query }}">
    </div>

    <select name="month" class="rpt-select" onchange="this.form.submit()">
        {% for m_num, m_name in months %}
        <option value="{{ m_num }}" {% if m_num == selected_month %}selected{% endif %}>{{ m_name }}</option>
        {% endfor %}
    </select>

    <select name="year" class="rpt-select" onchange="this.form.submit()">
        {% for y in years %}
        <option value="{{ y }}" {% if y == selected_year %}selected{% endif %}>{{ y }}</option>
        {% endfor %}
    </select>

    <label class="inactive-label">
        <input type="checkbox" name="show_inactive" value="1" {% if show_inactive %}checked{% endif %} onchange="this.form.submit()">
        Show inactive
    </label>

    <noscript><button type="submit" style="padding:.45rem .9rem;background:var(--primary-color);color:white;border:none;border-radius:7px;font-size:.83rem;cursor:pointer">Filter</button></noscript>
</form>
